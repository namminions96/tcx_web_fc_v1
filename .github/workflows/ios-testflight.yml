# Build app iPhone trên máy Mac của GitHub và đẩy thẳng lên TestFlight / App Store Connect.
# Chạy tay: tab Actions > "iOS - Build & TestFlight" > Run workflow.
# Cần khai báo các Secrets (Settings > Secrets and variables > Actions) - xem mobile-ios/HUONG-DAN.md
name: iOS - Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Số phiên bản hiển thị trên App Store (VD 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-ios
    env:
      BUNDLE_ID: com.fcvuive.app
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Kiểm tra Secrets của Apple
        working-directory: .
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8_BASE64" ] && missing="$missing ASC_KEY_P8_BASE64"
          if [ -n "$missing" ]; then
            echo "::error title=Chưa khai báo Secrets của Apple::Thiếu:$missing. Cần tài khoản Apple Developer (99 USD/năm) rồi thêm ở Settings > Secrets and variables > Actions - xem mobile-ios/HUONG-DAN.md mục 2 và 4."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cài thư viện
        run: bash scripts/ci-run.sh npm install

      - name: Copy web vào app
        run: npm run build

      - name: Tạo dự án Xcode (nếu chưa có)
        run: |
          if [ ! -d ios ]; then bash scripts/ci-run.sh npx cap add ios; fi

      - name: Tạo icon + màn hình chờ
        run: |
          brew install librsvg
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 -b '#070a13' assets-src/icon.svg -o assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          rsvg-convert -w 2732 -h 2732 -b '#070a13' assets-src/icon.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          bash scripts/ci-run.sh npm run assets

      - name: Đồng bộ web + plugin vào Xcode
        run: bash scripts/ci-run.sh npx cap sync ios

      - name: Cấu hình Info.plist
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion vi" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FC Vui Vẻ" $PLIST || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string FC Vui Vẻ" $PLIST
          # Chỉ dọc trên iPhone
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST

      - name: Khoá API App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build (archive)
        run: |
          bash scripts/ci-run.sh xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION=${{ github.event.inputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Đẩy lên App Store Connect (TestFlight)
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          bash scripts/ci-run.sh xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
